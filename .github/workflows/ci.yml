name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taverna_test
          POSTGRES_USER: taverna
          POSTGRES_PASSWORD: taverna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taverna -d taverna_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://taverna:taverna@localhost:5432/taverna_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Fuzz GLB
        run: go test ./internal/modelasset -run '^$' -fuzz '^FuzzGLBContainer$' -fuzztime=10s -parallel=2
      - name: Fuzz 3MF
        run: go test ./internal/modelasset -run '^$' -fuzz '^Fuzz3MFModel$' -fuzztime=10s -parallel=2
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    env:
      TEST_API_URL: http://localhost:5173
      TEST_ADMIN_EMAIL: smoke@example.test
      TEST_ADMIN_PASSWORD: disposable-ci-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: APP_DOMAIN=example.test docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Complete deployment scenario
        run: |
          node scripts/check-deployment.mjs
          docker compose exec -T backend /app/taverna-admin -email "$TEST_ADMIN_EMAIL"
          docker compose --profile tools run --rm seed
          node scripts/check-asset-library.mjs
          node scripts/check-starter-characters.mjs
          node scripts/check-print-stl.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable deployment
        if: always()
        run: docker compose down -v
