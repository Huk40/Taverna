services:
  frontend:
    ports: !reset []
    volumes:
      - ./frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    environment:
      DATABASE_URL: postgres://taverna:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/taverna?sslmode=disable
      AUTH_COOKIE_SECURE: "true"
      SMTP_ALLOW_INSECURE: "false"
      PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
